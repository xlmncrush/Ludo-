<!DOCTYPE html>
<html><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'>
<title>Ludo</title>
<style>
*{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:sans-serif;background:radial-gradient(#3a2a6e,#16102e);color:#fff;text-align:center;min-height:100vh}
.card{max-width:340px;margin:30px auto;padding:20px}
input{font-size:20px;padding:12px;border-radius:12px;border:0;width:80%;text-align:center;margin:6px 0;box-sizing:border-box}
button{font-size:19px;padding:12px 22px;margin:6px;border-radius:14px;border:0;background:#ffca28;color:#222;font-weight:bold}
button.s{background:#fff3;color:#fff}
#code{font-size:46px;letter-spacing:8px;font-weight:bold;color:#ffca28}
.pl{padding:8px;margin:4px;border-radius:10px;font-weight:bold;color:#222}
#top{display:flex;justify-content:center;gap:6px;margin:8px 4px;flex-wrap:wrap}
.tag{padding:6px 12px;border-radius:20px;font-size:14px;font-weight:bold;opacity:.5;color:#222}
.tag.on{opacity:1;box-shadow:0 0 0 3px #fff,0 0 14px #fff;animation:pu 1s infinite alternate}
@keyframes pu{to{transform:scale(1.08)}}
#msg{font-size:18px;min-height:24px;font-weight:bold}
#board{position:relative;width:min(98vw,58vh);aspect-ratio:1;margin:6px auto;background:#fff;border:3px solid #fff;border-radius:8px;box-shadow:0 8px 24px #000a}
.c{position:absolute;width:6.6667%;height:6.6667%;box-sizing:border-box;border:1px solid #bbb;background:#fff;color:#aaa;font-size:11px;display:flex;align-items:center;justify-content:center}
.q{position:absolute;width:40%;height:40%}
.w{position:absolute;left:8.33%;top:8.33%;width:83.3%;height:83.3%;background:#fff;border-radius:12px}
.o{position:absolute;width:21.67%;height:21.67%;border-radius:50%;opacity:.8}
#ctr{position:absolute;left:40%;top:40%;width:20%;height:20%;background:conic-gradient(from -45deg,#43a047 0 25%,#fdd835 0 50%,#1e88e5 0 75%,#e53935 0 100%)}
.p{position:absolute;width:5.6%;height:5.6%;border-radius:50%;border:2px solid #fff;box-sizing:border-box;box-shadow:0 3px 5px #0009;transition:left .19s ease,top .19s ease;z-index:5;background-image:radial-gradient(circle at 35% 30%,#ffffffbb,#fff0 45%)}
.can{animation:bn .5s infinite alternate;cursor:pointer;box-shadow:0 0 0 3px #fff,0 0 12px 4px #000}
@keyframes bn{to{transform:translateY(-25%) scale(1.25)}}
.hop{animation:hp .19s}
@keyframes hp{50%{transform:translateY(-55%) scale(1.35)}}
#dice{width:76px;height:76px;margin:8px auto;background:#fff;border-radius:16px;border:5px solid #888;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;box-sizing:border-box;gap:2px;box-shadow:0 4px 12px #000a}
#dice i{border-radius:50%}
#dice i.on{background:#222}
.roll{animation:rl .18s infinite}
@keyframes rl{0%{transform:rotate(0) scale(1.1)}50%{transform:rotate(180deg) scale(.9)}100%{transform:rotate(360deg) scale(1.1)}}
.tap{animation:pu .6s infinite alternate}
</style></head><body>
<div id='home' class='card'>
<h1>🎲 লুডো</h1>
<input id='nm' placeholder='তোমার নাম' maxlength='10'>
<button onclick='create()'>নতুন রুম বানাও</button>
<p>অথবা বন্ধুর কোড দিয়ে ঢোকো</p>
<input id='rc' placeholder='রুম কোড' maxlength='4' style='text-transform:uppercase'>
<button class='s' onclick='join()'>রুমে ঢোকো</button>
</div>
<div id='lobby' class='card' style='display:none'>
<p>রুম কোড (বন্ধুদের দাও)</p><div id='code'></div>
<button class='s' onclick='copyLink()'>লিংক কপি করো</button>
<div id='pl'></div>
<button id='st' onclick='startGame()' style='display:none'>খেলা শুরু করো ▶</button>
<p id='wait'></p>
<button class='s' onclick='leave()'>বেরিয়ে যাও</button>
</div>
<div id='game' style='display:none'>
<div id='top'></div><div id='msg'></div><div id='board'></div><div id='dice' onclick='roll()'></div>
<button id='again' class='s' style='display:none' onclick='leave()'>নতুন খেলা</button>
</div>
<script>
const DB='https://ludo-fun-e2a11-default-rtdb.firebaseio.com';
const COL=['red','green','yellow','blue'],SEAT=['red','yellow','green','blue'];
const HEX={red:'#e53935',green:'#43a047',yellow:'#fdd835',blue:'#1e88e5'};
const OFF={red:0,green:13,yellow:26,blue:39};
const SAFE=new Set([0,8,13,21,26,34,39,47]);
const ORG={red:[0,0],green:[0,9],yellow:[9,9],blue:[9,0]};
const SLOT=[[1,1],[1,4],[4,1],[4,4]];
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const T=[];const add=(r,c)=>T.push([r,c]);
for(let c=1;c<=5;c++)add(6,c);
for(let r=5;r>=0;r--)add(r,6);
add(0,7);add(0,8);
for(let r=1;r<=5;r++)add(r,8);
for(let c=9;c<=14;c++)add(6,c);
add(7,14);add(8,14);
for(let c=13;c>=9;c--)add(8,c);
for(let r=9;r<=14;r++)add(r,8);
add(14,7);add(14,6);
for(let r=13;r>=9;r--)add(r,6);
for(let c=5;c>=0;c--)add(8,c);
add(7,0);add(6,0);
const H={red:[],green:[],yellow:[],blue:[]};
for(let k=1;k<=5;k++){H.red.push([7,k]);H.green.push([k,7]);H.yellow.push([7,14-k]);H.blue.push([14-k,7]);}
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=localStorage.u||(localStorage.u=Math.random().toString(36).slice(2,10));
let me={},S=null,seen=0,seenRid=0,seenMove=0,disp={},EL={},busy=false,inited=false,polling=false,timer=null,q=Promise.resolve();
const api=(p,m,b)=>fetch(DB+p+'.json',{method:m||'GET',body:b?JSON.stringify(b):undefined,cache:'no-store'}).then(r=>r.json());
const clean=s=>(s||'').replace(/[<>&]/g,'').trim()||'Player';
function show(id){['home','lobby','game'].forEach(x=>$(x).style.display=x===id?'block':'none');}
async function create(){
 const name=clean($('nm').value);
 const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
 await api('/rooms/'+code,'PUT',{players:{red:{n:name,u:uid}},started:false});
 enter(code,'red',name);
}
async function join(){
 const name=clean($('nm').value),code=$('rc').value.trim().toUpperCase();
 const r=await api('/rooms/'+code);
 if(!r)return alert('এই কোডের রুম নেই');
 const pl=r.players||{};
 let col=SEAT.find(c=>pl[c]&&pl[c].u===uid);
 if(!col){
  if(r.started)return alert('খেলা শুরু হয়ে গেছে');
  col=SEAT.find(c=>!pl[c]);
  if(!col)return alert('রুম ভরে গেছে');
  await api('/rooms/'+code+'/players/'+col,'PUT',{n:name,u:uid});
 }
 enter(code,col,name);
}
function enter(code,col,name){
 me={code,col,name};localStorage.room=JSON.stringify(me);
 show('lobby');$('code').textContent=code;
 if(!timer)timer=setInterval(poll,800);
 poll();
}
function leave(){localStorage.removeItem('room');location.href=location.pathname;}
function copyLink(){
 const l=location.origin+location.pathname+'?r='+me.code;
 if(navigator.clipboard)navigator.clipboard.writeText(l).then(()=>alert('কপি হয়েছে'));else prompt('কপি করো',l);
}
async function startGame(){
 const r=await api('/rooms/'+me.code);const pl=r.players;
 const act=COL.filter(c=>pl[c]);const P={};act.forEach(c=>P[c]=[-1,-1,-1,-1]);
 await api('/rooms/'+me.code,'PATCH',{started:true,act,P,turn:0,phase:'roll',dice:0,rid:0,last:{id:0},ver:1});
}
async function poll(){
 if(!me.code||polling)return;polling=true;
 try{
  const r=await api('/rooms/'+me.code);if(!r)return;
  const pl=r.players||{};
  if(!r.started){
   $('pl').innerHTML=SEAT.filter(c=>pl[c]).map(c=>`<div class='pl' style='background:${HEX[c]}'>${pl[c].n}${c===me.col?' (তুমি)':''}</div>`).join('');
   const host=me.col==='red';
   $('st').style.display=host&&Object.keys(pl).length>1?'inline-block':'none';
   $('wait').textContent=host?(Object.keys(pl).length>1?'':'বন্ধুদের জন্য অপেক্ষা...'):'হোস্ট খেলা শুরু করবে...';
   return;
  }
  if(!inited)initGame(r);
  else if(r.ver>seen){seen=r.ver;S=r;q=q.then(()=>apply(r));}
 }catch(e){}finally{polling=false;}
}
function initGame(r){
 inited=true;S=r;seen=r.ver;seenRid=r.rid;seenMove=r.last?r.last.id:0;
 disp=JSON.parse(JSON.stringify(r.P));
 build(r.act);show('game');rp();ui(r);
}
function box(r,c,bg,txt){const d=document.createElement('div');d.className='c';d.style.left=c/15*100+'%';d.style.top=r/15*100+'%';if(bg)d.style.background=bg;if(txt)d.textContent=txt;$('board').appendChild(d);}
function build(act){
 const b=$('board');b.innerHTML='';
 COL.forEach(c=>{
  const e=document.createElement('div');e.className='q';
  e.style.cssText=`background:${HEX[c]};left:${ORG[c][1]/15*100}%;top:${ORG[c][0]/15*100}%`;
  e.innerHTML="<div class='w'></div>"+SLOT.map(s=>`<div class='o' style='background:${HEX[c]};left:${(s[1]-.15)/6*100}%;top:${(s[0]-.15)/6*100}%'></div>`).join('');
  b.appendChild(e);
 });
 T.forEach((x,i)=>{let bg='';COL.forEach(c=>{if(OFF[c]===i)bg=HEX[c];});box(x[0],x[1],bg,SAFE.has(i)&&!bg?'★':'');});
 COL.forEach(c=>H[c].forEach(x=>box(x[0],x[1],HEX[c])));
 const ct=document.createElement('div');ct.id='ctr';b.appendChild(ct);
 EL={};
 act.forEach(c=>{EL[c]=[0,1,2,3].map(i=>{
  const e=document.createElement('div');e.className='p';e.style.backgroundColor=HEX[c];
  e.onclick=()=>pick(c,i);b.appendChild(e);return e;});});
}
function cell(c,i,p){
 if(p<0)return [ORG[c][0]+SLOT[i][0],ORG[c][1]+SLOT[i][1]];
 if(p<=50)return T[(OFF[c]+p)%52];
 if(p<=55)return H[c][p-51];
 return [7+(i-1.5)*0.2,7+(COL.indexOf(c)-1.5)*0.25];
}
function rp(){
 const sn={};
 S.act.forEach(c=>disp[c].forEach((p,i)=>{
  const x=cell(c,i,p),k=x.join(),n=sn[k]||0;sn[k]=n+1;
  const e=EL[c][i];
  e.style.left=(x[1]+.08+n*.12)/15*100+'%';
  e.style.top=(x[0]+.08-n*.12)/15*100+'%';
  e.style.zIndex=5+n;
 }));
}
function face(n){$('dice').innerHTML=[0,1,2,3,4,5,6,7,8].map(i=>`<i class='${PIPS[n].includes(i)?'on':''}'></i>`).join('');}
function ui(s){
 const c=s.act[s.turn],my=c===me.col,pl=s.players||{};
 $('top').innerHTML=s.act.map(x=>`<span class='tag${x===c?' on':''}' style='background:${HEX[x]}'>${pl[x]?pl[x].n:x}</span>`).join('');
 face(s.dice||0);
 $('dice').style.borderColor=HEX[c];
 $('dice').className=(s.phase==='roll'&&my)?'tap':'';
 const nm=pl[c]?pl[c].n:c;
 $('msg').textContent=s.phase==='over'?'🎉 '+nm+' জিতে গেছে!':my?(s.phase==='move'?'পিস বেছে নাও 👆':s.phase==='roll'?'তোমার পালা, ডাইসে ট্যাপ করো':'...'):nm+'-এর পালা';
 $('again').style.display=s.phase==='over'?'inline-block':'none';
 s.act.forEach(x=>EL[x].forEach((e,i)=>e.classList.toggle('can',s.phase==='move'&&my&&x===me.col&&(s.mv||[]).includes(i))));
}
async function rollAnim(d){
 const e=$('dice');e.className='roll';
 for(let i=0;i<8;i++){face(1+Math.floor(Math.random()*6));await sleep(90);}
 e.className='';face(d);await sleep(250);
}
async function moveAnim(l){
 const e=EL[l.c][l.i];
 if(l.f>=0)disp[l.c][l.i]=l.f;
 e.classList.remove('can');
 const steps=l.f<0?[0]:Array.from({length:l.t-l.f},(_,k)=>l.f+1+k);
 for(const p of steps){
  disp[l.c][l.i]=p;rp();
  e.classList.remove('hop');void e.offsetWidth;e.classList.add('hop');
  await sleep(200);
 }
 await sleep(120);
}
async function apply(s){
 if(s.rid>seenRid){seenRid=s.rid;await rollAnim(s.dice);}
 if(s.last&&s.last.id>seenMove){seenMove=s.last.id;await moveAnim(s.last);}
 s.act.forEach(c=>s.P[c].forEach((p,i)=>disp[c][i]=p));
 rp();ui(s);
}
function commit(ns){
 ns.ver=seen+1;seen=ns.ver;S=ns;
 const f={};['turn','phase','dice','rid','mv','P','last','ver'].forEach(k=>f[k]=ns[k]);
 api('/rooms/'+me.code,'PATCH',f);
 return q=q.then(()=>apply(ns));
}
async function getDice(){
 try{
  const r=await fetch(DB+'/next.json',{cache:'no-store'});
  const v=await r.json();
  if(Number.isInteger(v)&&v>=1&&v<=6){fetch(DB+'/next.json',{method:'DELETE'});return v;}
 }catch(e){}
 return 1+Math.floor(Math.random()*6);
}
const movable=(a,d)=>a.map((p,i)=>(p<0?d===6:p+d<=56)?i:-1).filter(i=>i>=0);
async function roll(){
 if(!S||S.phase!=='roll'||S.act[S.turn]!==me.col||busy)return;
 busy=true;
 const d=await getDice(),mv=movable(S.P[me.col],d);
 await commit({...S,dice:d,rid:S.rid+1,mv,phase:mv.length?'move':'pass'});
 if(!mv.length){await sleep(400);await commit({...S,phase:'roll',turn:(S.turn+1)%S.act.length,mv:[]});}
 else if(mv.length===1){await sleep(300);await doMove(mv[0]);}
 busy=false;
}
function pick(c,i){
 if(!S||busy||S.phase!=='move'||c!==me.col||S.act[S.turn]!==c||!(S.mv||[]).includes(i))return;
 busy=true;doMove(i).then(()=>busy=false);
}
async function doMove(i){
 const s=S,c=me.col,d=s.dice;
 const P2=JSON.parse(JSON.stringify(s.P));
 const f=P2[c][i],t=f<0?0:f+d;P2[c][i]=t;
 let extra=d===6;
 if(t<=50&&!SAFE.has((OFF[c]+t)%52)){
  const idx=(OFF[c]+t)%52;
  s.act.forEach(o=>{if(o!==c)P2[o].forEach((x,j)=>{if(x>=0&&x<=50&&(OFF[o]+x)%52===idx){P2[o][j]=-1;extra=true;}});});
 }
 if(t===56)extra=true;
 const won=P2[c].every(x=>x===56);
 await commit({...s,P:P2,mv:[],last:{c,i,f,t,id:(s.last?s.last.id:0)+1},phase:won?'over':'roll',turn:(won||extra)?s.turn:(s.turn+1)%s.act.length});
}
(async()=>{
 const u=new URLSearchParams(location.search).get('r');if(u)$('rc').value=u;
 try{
  const m=JSON.parse(localStorage.room||'null');
  if(m&&(!u||u.toUpperCase()===m.code)){
   const r=await api('/rooms/'+m.code);
   if(r&&r.players&&r.players[m.col]&&r.players[m.col].u===uid)enter(m.code,m.col,m.name);
   else localStorage.removeItem('room');
  }
 }catch(e){}
})();
</script></body></html>
