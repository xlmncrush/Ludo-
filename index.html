<!DOCTYPE html>
<html><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Ludo</title>
<style>
body{margin:0;font-family:sans-serif;background:#222;color:#fff;text-align:center}
#board{position:relative;width:min(96vw,65vh);aspect-ratio:1;margin:8px auto;background:#fff}
.c{position:absolute;width:6.6667%;height:6.6667%;box-sizing:border-box;border:1px solid #999;background:#fff;color:#555;font-size:12px;line-height:1}
.q{position:absolute;width:40%;height:40%;box-sizing:border-box;border:2px solid #333}
.p{position:absolute;width:6.6667%;height:6.6667%;border-radius:50%;border:2px solid #000;box-sizing:border-box;transition:left .3s,top .3s;z-index:5}
.can{outline:3px solid #fff;animation:b .5s infinite alternate}
@keyframes b{to{transform:scale(1.3)}}
button{font-size:20px;padding:12px 24px;margin:6px;border-radius:10px;border:0}
#dice{display:inline-block;width:56px;height:56px;line-height:56px;font-size:34px;background:#fff;color:#000;border-radius:10px;margin:6px}
</style></head><body>
<div id='menu'><h2>লুডো</h2><p>কতজন খেলবে?</p>
<button onclick='start(2)'>২ জন</button><button onclick='start(3)'>৩ জন</button><button onclick='start(4)'>৪ জন</button></div>
<div id='game' style='display:none'>
<div id='msg' style='font-size:20px;margin-top:8px'></div>
<div id='board'></div>
<span id='dice'>-</span><button id='rb' onclick='roll()'>ডাইস ফেলো</button>
</div>
<script>
const DB='https://ludo-fun-e2a11-default-rtdb.firebaseio.com';
const COL=['red','green','yellow','blue'];
const HEX={red:'#e53935',green:'#43a047',yellow:'#fdd835',blue:'#1e88e5'};
const BN={red:'লাল',green:'সবুজ',yellow:'হলুদ',blue:'নীল'};
const OFF={red:0,green:13,yellow:26,blue:39};
const SAFE=new Set([0,8,13,21,26,34,39,47]);
const ORG={red:[0,0],green:[0,9],yellow:[9,9],blue:[9,0]};
const SLOT=[[1,1],[1,4],[4,1],[4,4]];
const T=[];const add=(r,c)=>T.push([r,c]);
for(let c=1;c<=5;c++)add(6,c);
for(let r=5;r>=0;r--)add(r,6);
add(0,7);add(0,8);
for(let r=1;r<=5;r++)add(r,8);
for(let c=9;c<=14;c++)add(6,c);
add(7,14);add(8,14);
for(let c=13;c>=9;c--)add(8,c);
for(let r=9;r<=14;r++)add(r,8);
add(14,7);add(14,6);
for(let r=13;r>=9;r--)add(r,6);
for(let c=5;c>=0;c--)add(8,c);
add(7,0);add(6,0);
const H={red:[],green:[],yellow:[],blue:[]};
for(let k=1;k<=5;k++){H.red.push([7,k]);H.green.push([k,7]);H.yellow.push([7,14-k]);H.blue.push([14-k,7]);}
let players=[],P={},EL={},turn=0,dice=0,phase='roll',mv=[];
const $=id=>document.getElementById(id);
function place(el,r,c){el.style.left=c/15*100+'%';el.style.top=r/15*100+'%';}
function box(r,c,bg,txt){const d=document.createElement('div');d.className='c';place(d,r,c);if(bg)d.style.background=bg;if(txt)d.textContent=txt;$('board').appendChild(d);}
function build(){
 const b=$('board');b.innerHTML='';
 COL.forEach(c=>{const q=document.createElement('div');q.className='q';q.style.background=HEX[c];q.style.left=ORG[c][1]/15*100+'%';q.style.top=ORG[c][0]/15*100+'%';b.appendChild(q);});
 T.forEach((x,i)=>{let bg='';COL.forEach(c=>{if(OFF[c]===i)bg=HEX[c];});box(x[0],x[1],bg,SAFE.has(i)?'★':'');});
 COL.forEach(c=>H[c].forEach(x=>box(x[0],x[1],HEX[c])));
 box(7,7,'#333');
 EL={};
 players.forEach(c=>{EL[c]=[0,1,2,3].map(i=>{const e=document.createElement('div');e.className='p';e.style.background=HEX[c];e.onclick=()=>pick(c,i);b.appendChild(e);return e;});});
}
function cell(c,i){
 const p=P[c][i];
 if(p<0)return [ORG[c][0]+SLOT[i][0],ORG[c][1]+SLOT[i][1]];
 if(p<=50)return T[(OFF[c]+p)%52];
 if(p<=55)return H[c][p-51];
 return [7+(i-1.5)*0.2,7+(COL.indexOf(c)-1.5)*0.25];
}
function render(){
 const seen={};
 players.forEach(c=>P[c].forEach((p,i)=>{
  const x=cell(c,i);const k=x.join(',');const n=seen[k]||0;seen[k]=n+1;
  place(EL[c][i],x[0]+n*0.12,x[1]+n*0.12);
  EL[c][i].classList.toggle('can',phase==='move'&&c===players[turn]&&mv.includes(i));
 }));
 const c=players[turn];
 $('msg').textContent=phase==='over'?BN[c]+' জিতে গেছে! 🎉':BN[c]+'-এর পালা';
 $('msg').style.color=HEX[c];
 $('rb').disabled=phase!=='roll';
}
function start(n){
 players=n===2?['red','yellow']:n===3?['red','green','yellow']:COL.slice();
 P={};players.forEach(c=>P[c]=[-1,-1,-1,-1]);
 turn=0;phase='roll';mv=[];
 $('menu').style.display='none';$('game').style.display='block';
 build();render();
}
async function getDice(){
 try{
  const r=await fetch(DB+'/next.json',{cache:'no-store'});
  const v=await r.json();
  if(Number.isInteger(v)&&v>=1&&v<=6){fetch(DB+'/next.json',{method:'DELETE'});return v;}
 }catch(e){}
 return 1+Math.floor(Math.random()*6);
}
async function roll(){
 if(phase!=='roll')return;
 phase='busy';render();
 const d=await getDice();dice=d;$('dice').textContent=d;
 const c=players[turn];mv=[];
 P[c].forEach((p,i)=>{if(p<0?d===6:p+d<=56)mv.push(i);});
 if(!mv.length){setTimeout(next,1000);return;}
 if(mv.length===1){const i=mv[0];setTimeout(()=>move(i),500);return;}
 phase='move';render();
}
function pick(c,i){if(phase==='move'&&c===players[turn]&&mv.includes(i))move(i);}
function next(){turn=(turn+1)%players.length;phase='roll';mv=[];render();}
function move(i){
 const c=players[turn];
 phase='busy';mv=[];
 let p=P[c][i];let extra=dice===6;
 p=p<0?0:p+dice;P[c][i]=p;
 if(p<=50&&!SAFE.has((OFF[c]+p)%52)){
  const idx=(OFF[c]+p)%52;
  players.forEach(o=>{if(o!==c)P[o].forEach((q,j)=>{if(q>=0&&q<=50&&(OFF[o]+q)%52===idx){P[o][j]=-1;extra=true;}});});
 }
 if(p===56)extra=true;
 if(P[c].every(x=>x===56)){phase='over';render();return;}
 render();
 setTimeout(()=>{if(!extra)turn=(turn+1)%players.length;phase='roll';mv=[];render();},600);
}
</script></body></html>
